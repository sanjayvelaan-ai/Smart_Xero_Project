services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: printflow
      POSTGRES_USER: printflow
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - printflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printflow"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  printflow_postgres:
